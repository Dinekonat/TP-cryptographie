server {
    listen 443 ssl;
    server_name www.tp.local;

    # --- Certificats du serveur ---
    # La chaine presentee doit contenir : cert serveur + intermediaire (jamais la racine)
    ssl_certificate     /etc/nginx/tls/serveur_chaine.crt;
    ssl_certificate_key /etc/nginx/tls/serveur.key;

    # --- Versions de TLS autorisees ---
    # TLS 1.0 et 1.1 sont obsoletes et vulnerables (POODLE, BEAST) : interdits
    ssl_protocols TLSv1.2 TLSv1.3;

    # --- Preference des suites cote client ---
    # off = le client choisit sa suite preferee (recommande avec TLS 1.3 car
    # les suites TLS 1.3 sont toutes securisees)
    ssl_prefer_server_ciphers off;

    # --- Tickets de session desactives ---
    # Les tickets de session utilisent une cle symetrique statique : si elle fuite,
    # toutes les sessions passees sont dechiffrables (perte de forward secrecy)
    ssl_session_tickets off;

    # --- Authentification mutuelle des clients (mTLS) ---
    # Le serveur exige un certificat client signe par notre racine
    ssl_client_certificate /etc/nginx/tls/racine.crt;
    ssl_verify_client on;
    ssl_verify_depth 2;          # racine -> intermediaire -> client : profondeur 2

    # --- Verification des CRL (certificats revoques) ---
    ssl_crl /etc/nginx/tls/crls.pem;

    # --- HSTS : force HTTPS pour 1 an ---
    # Protege contre les attaques de downgrade HTTP (ex: sslstrip)
    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        # Affiche le DN du client authentifie dans la reponse
        return 200 "Bonjour $ssl_client_s_dn\n";
    }
}
